description: 'Survios is a virtual reality game studio that develops and publishes immersive VR titles
  across major platforms including PlayStation VR, Steam, Meta Quest, Xbox, and Nintendo Switch. Known
  for award-winning games such as Raw Data, Creed: Rise to Glory, The Walking Dead: Onslaught, Sprint
  Vector, Electronauts, and Alien: Rogue Incursion, the studio describes itself as one of the world''s
  leading VR games studios. Backed by Lux Capital, Survios operates as a consumer games company; as of
  this enrichment pass it publishes no public developer API, SDK, or developer portal surface.'
